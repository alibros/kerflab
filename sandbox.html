<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Pin the stored theme before first paint (see initTheme in src/app/ui/theme.ts). */
      try { var t = localStorage.getItem('kerflab:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <title>KerfLab · component sheet</title>
  </head>
  <body>
    <div id="sandbox"></div>
    <script type="module" src="/src/sandbox/main.ts"></script>
  </body>
</html>
